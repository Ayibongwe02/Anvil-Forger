# Anvil v2 Development Docker Compose
# SQLite database is persisted via bind-mounted ./data volume
services:
  anvil:
    image: anvil-v2:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anvil-dev
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    environment:
      - ANVIL_SECRET_KEY=${ANVIL_SECRET_KEY:-change-me-in-development}
      - FLASK_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
