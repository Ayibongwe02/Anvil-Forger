{% extends "base.html" %}
{% block title %}Log in — Anvil{% endblock %}
{% block content %}
<div class="wave-bg" aria-hidden="true">
    <svg class="wave-layer wave-layer-3" viewBox="0 0 2400 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,140 C100,80 200,190 300,140 C400,80 500,190 600,140 C700,80 800,190 900,140 C1000,80 1100,190 1200,140 C1300,80 1400,190 1500,140 C1600,80 1700,190 1800,140 C1900,80 2000,190 2100,140 C2200,80 2300,190 2400,140 L2400,220 L0,220 Z"/>
    </svg>
    <svg class="wave-layer wave-layer-2" viewBox="0 0 2400 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,120 C133,65 267,185 400,120 C533,65 667,185 800,120 C933,65 1067,185 1200,120 C1333,65 1467,185 1600,120 C1733,65 1867,185 2000,120 C2133,65 2267,185 2400,120 L2400,220 L0,220 Z"/>
    </svg>
    <svg class="wave-layer wave-layer-1" viewBox="0 0 2400 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,160 C67,125 133,190 200,160 C267,125 333,190 400,160 C467,125 533,190 600,160 C667,125 733,190 800,160 C867,125 933,190 1000,160 C1067,125 1133,190 1200,160 C1267,125 1333,190 1400,160 C1467,125 1533,190 1600,160 C1667,125 1733,190 1800,160 C1867,125 1933,190 2000,160 C2067,125 2133,190 2200,160 C2267,125 2333,190 2400,160 L2400,220 L0,220 Z"/>
    </svg>
</div>
<div class="auth-page">
    <div class="auth-splash">
        <span class="auth-splash-mark">⚒</span>
        <h1 class="auth-splash-title">Anvil</h1>
        <p class="subtitle">Train ML models as a team. Export them anywhere.</p>
    </div>
    <div class="card">
        <span class="eyebrow"><span class="eyebrow-mark">⚒</span> Sign in</span>
        <form method="POST">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email" required autofocus autocomplete="username">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password" required autocomplete="current-password">
            <div class="auth-links-inline">
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </div>
        </form>
    </div>
    <p style="text-align:center; font-size: 13px;">
        New team? <a href="{{ url_for('signup_team') }}">Create one</a> ·
        Have an invite code? <a href="{{ url_for('signup_join') }}">Join a team</a>
    </p>
</div>
{% endblock %}
